name: Build Windows x64 Portable
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-portable:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: true

      - name: Install Protoc for plugin-runtime
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: vp install
      - run: npm run bootstrap
        env:
          YAAK_TARGET_ARCH: x64

      - name: Set version from Cargo.toml
        shell: pwsh
        run: |
          $m = Select-String -Path crates-tauri/yaak-app-client/Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1
          $ver = if ($m) { $m.Matches[0].Groups[1].Value } else { "0.0.0" }
          "YAAK_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Replace version
        run: npm run replace-version
        env:
          YAAK_VERSION: ${{ env.YAAK_VERSION }}

      - name: Build portable exe (no bundle, no sign)
        shell: pwsh
        env:
          YAAK_TARGET_ARCH: x64
        run: |
          Push-Location crates-tauri/yaak-app-client
          node ../../node_modules/@tauri-apps/cli/tauri.js build --config ./tauri.release.conf.json --no-bundle --no-sign
          if ($LASTEXITCODE -ne 0) { Pop-Location; exit $LASTEXITCODE }
          Pop-Location

      - name: Verify & stage portable exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path target\release -Filter *.exe -File | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw "No exe found in target/release" }
          if ($exe.Length -lt 10MB) { throw "exe too small ($($exe.Length) bytes): $($exe.Name)" }
          $stage = Join-Path $env:RUNNER_TEMP 'portable-stage'
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe.FullName (Join-Path $stage $exe.Name)
          # Upload the unpacked exe so the downloaded artifact is a single zip layer,
          # never a zip inside a zip.
          "PORTABLE_STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: yaak-windows-x64-portable
          path: ${{ env.PORTABLE_STAGE }}
          if-no-files-found: error
          retention-days: 7
